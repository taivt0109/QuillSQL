[package]
name = "quillsql"
version = "0.3.1"
edition = "2024"
description = "T-SQL formatter, code analysis and SSMS IntelliSense engine"
license = "MIT"
repository = "https://github.com/taivt0109/QuillSQL"

[[bin]]
name = "quill"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
winresource = "0.1.34"
