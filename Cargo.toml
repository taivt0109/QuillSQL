[package]
name = "quillsql"
version = "0.4.25"
edition = "2024"
description = "T-SQL formatter, code analysis and SSMS IntelliSense engine"
license = "MIT"
repository = "https://github.com/taivt0109/QuillSQL"

[[bin]]
name = "quill"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiberius = { version = "0.13.0", default-features = false, features = ["tds80", "rustls", "sql-browser-tokio", "chrono"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "io-util"] }
# Already used by tiberius; HTTPS to Microsoft Entra for sign-in tokens.
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
chrono = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.13.0", default-features = false, features = ["winauth"] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tiberius = { version = "0.13.0", default-features = false, features = ["tds80", "rustls"] }
