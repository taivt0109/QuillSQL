[package]
name = "quillsql"
version = "0.3.3"
edition = "2024"
description = "T-SQL formatter, code analysis and SSMS IntelliSense engine"
license = "MIT"
repository = "https://github.com/taivt0109/QuillSQL"

[[bin]]
name = "quill"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiberius = { version = "0.13.0", default-features = false, features = ["tds80", "rustls", "sql-browser-tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.13.0", default-features = false, features = ["winauth"] }

[build-dependencies]
winresource = "0.1.34"
