[[known]]
scenario = "data-binary-key"
oracle = "check"
finding = "new"
reason = "quill pairs varbinary keys 0x0102 and 0x010200 (equal under SQL Server's trailing-zero rule) and leaves the target bytes; Redgate compares bytes exactly (and also fails to pair 0xFF, deleting and re-inserting it)"

[[known]]
scenario = "data-binary-key"
oracle = "converge-quill"
finding = "new"
reason = "quill pairs varbinary keys 0x0102 and 0x010200 (equal under SQL Server's trailing-zero rule) and leaves the target bytes; Redgate compares bytes exactly (and also fails to pair 0xFF, deleting and re-inserting it)"

[[known]]
scenario = "data-binary-key"
oracle = "diffset"
finding = "new"
reason = "quill pairs varbinary keys 0x0102 and 0x010200 (equal under SQL Server's trailing-zero rule) and leaves the target bytes; Redgate compares bytes exactly (and also fails to pair 0xFF, deleting and re-inserting it)"

[[known]]
scenario = "data-binary-key"
oracle = "outcome"
finding = "new"
reason = "quill pairs varbinary keys 0x0102 and 0x010200 (equal under SQL Server's trailing-zero rule) and leaves the target bytes; Redgate compares bytes exactly (and also fails to pair 0xFF, deleting and re-inserting it)"

[[known]]
scenario = "data-unicode"
oracle = "check"
finding = "new"
reason = "quill compares nvarchar by code points; Redgate uses the column collation, so e+combining acute = é and two different emoji (supplementary characters) are equal for Redgate"

[[known]]
scenario = "data-unicode"
oracle = "converge-redgate"
finding = "new"
reason = "quill compares nvarchar by code points; Redgate uses the column collation, so e+combining acute = é and two different emoji (supplementary characters) are equal for Redgate"

[[known]]
scenario = "data-unicode"
oracle = "diffset"
finding = "new"
reason = "quill compares nvarchar by code points; Redgate uses the column collation, so e+combining acute = é and two different emoji (supplementary characters) are equal for Redgate"

