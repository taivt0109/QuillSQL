[[known]]
scenario = "data-type-pairs"
oracle = "converge-quill"
finding = "AUDIT2-BRIEF deviation"
reason = "documented deviation: date/datetime pairs are compared by value; Vendor reports datetime vs datetime2 (and the other cross-type rows) as different"

[[known]]
scenario = "data-type-pairs"
oracle = "diffset"
finding = "AUDIT2-BRIEF deviation"
reason = "documented deviation: date/datetime pairs are compared by value; Vendor reports datetime vs datetime2 (and the other cross-type rows) as different"

[[known]]
scenario = "data-binary-key"
oracle = "diffset"
finding = "new"
reason = "Vendor fails to pair the equal key 0xFF (deletes and re-inserts it), so its counts differ; quill pairs it"
[[known]]
scenario = "data-binary-key"
oracle = "prints"
finding = "new"
reason = "Vendor fails to pair the equal key 0xFF, so it deletes and re-inserts two rows and prints messages for them"

[[known]]
scenario = "data-mot-backup"
oracle = "prints"
finding = "data H2"
reason = "Vendor's backup reader crashes on this backup, so it writes no script"

[[known]]
scenario = "data-type-pairs"
oracle = "prints"
finding = "AUDIT2-BRIEF deviation"
reason = "documented deviation: quill compares date/datetime pairs by value, so it updates one row where Vendor updates two"

