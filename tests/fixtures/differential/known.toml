# Known differences between quill and the Vendor tools; see README.md.

[[known]]
scenario = "*"
oracle = "names"
finding = "new"
reason = "quill brackets principal, schema and DDL-trigger names in report fqn/console (role-[App], schema-[App], ddltrigger-[T]); Vendor writes them bare (role-App)"

