# Known differences between quill and the Redgate tools; see README.md.

[[known]]
scenario = "data-mot-backup"
oracle = "check"
finding = "data H2"
reason = "Redgate's backup reader crashes on this backup (FormatException in its log reader), so nothing can be compared; quill reads it and leaves the memory-optimized table uncompared"

[[known]]
scenario = "data-mot-backup"
oracle = "converge-quill"
finding = "data H2"
reason = "Redgate's backup reader crashes on this backup (FormatException in its log reader), so nothing can be compared; quill reads it and leaves the memory-optimized table uncompared"

[[known]]
scenario = "data-mot-backup"
oracle = "converge-redgate"
finding = "data H2"
reason = "Redgate's backup reader crashes on this backup (FormatException in its log reader), so nothing can be compared; quill reads it and leaves the memory-optimized table uncompared"

[[known]]
scenario = "data-mot-backup"
oracle = "diffset"
finding = "data H2"
reason = "Redgate's backup reader crashes on this backup (FormatException in its log reader), so nothing can be compared; quill reads it and leaves the memory-optimized table uncompared"

[[known]]
scenario = "data-mot-backup"
oracle = "exit"
finding = "data H2"
reason = "Redgate's backup reader crashes on this backup (FormatException in its log reader), so nothing can be compared; quill reads it and leaves the memory-optimized table uncompared"

[[known]]
scenario = "data-mot-backup"
oracle = "outcome"
finding = "data H2"
reason = "Redgate's backup reader crashes on this backup (FormatException in its log reader), so nothing can be compared; quill reads it and leaves the memory-optimized table uncompared"

[[known]]
scenario = "data-type-pairs"
oracle = "converge-quill"
finding = "AUDIT2-BRIEF deviation"
reason = "documented deviation: date/datetime pairs are compared by value; Redgate reports datetime vs datetime2 (and the other cross-type rows) as different"

[[known]]
scenario = "data-type-pairs"
oracle = "diffset"
finding = "AUDIT2-BRIEF deviation"
reason = "documented deviation: date/datetime pairs are compared by value; Redgate reports datetime vs datetime2 (and the other cross-type rows) as different"

[[known]]
scenario = "data-binary-key"
oracle = "diffset"
finding = "new"
reason = "Redgate fails to pair the equal key 0xFF (deletes and re-inserts it), so its counts differ; quill pairs it"

[[known]]
scenario = "data-binary-key"
oracle = "prints"
finding = "new"
reason = "Redgate fails to pair the equal key 0xFF, so it deletes and re-inserts two rows and prints messages for them"

[[known]]
scenario = "data-mot-backup"
oracle = "prints"
finding = "data H2"
reason = "Redgate's backup reader crashes on this backup, so it writes no script"

[[known]]
scenario = "data-type-pairs"
oracle = "prints"
finding = "AUDIT2-BRIEF deviation"
reason = "documented deviation: quill compares date/datetime pairs by value, so it updates one row where Redgate updates two"

[[known]]
scenario = "sources-followup-backup"
oracle = "warnings"
finding = "sources-followup"
reason = "SQL Compare gives no 'created without an associated login' warning for the users Owner1 and Reader (altered: an extended property, a role membership) when database 1 is a backup, though it does for the same users from a live database, snapshot or scripts folder; quill warns the same way for every source"
