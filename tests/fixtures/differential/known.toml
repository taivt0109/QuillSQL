# Known differences between quill and the Vendor tools; see README.md.

[[known]]
scenario = "data-mot-backup"
oracle = "check"
finding = "data H2"
reason = "Vendor's backup reader crashes on this backup (FormatException in its log reader), so nothing can be compared; quill reads it and leaves the memory-optimized table uncompared"

[[known]]
scenario = "data-mot-backup"
oracle = "converge-quill"
