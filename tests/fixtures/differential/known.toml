[[known]]
scenario = "schema-triggers"
oracle = "converge-redgate"
finding = "new"
reason = "quill compares the trigger text literally: Redgate deploys CREATE TRIGGER [dbo].[T_Ins] ON [dbo].[T] and quill then reports the table different from the source text CREATE TRIGGER dbo.T_Ins ON dbo.T"

