# Known differences between quill and the Redgate tools; see README.md.

[[known]]
scenario = "*"
oracle = "names"
finding = "new"
reason = "quill brackets principal, schema and DDL-trigger names in report fqn/console (role-[App], schema-[App], ddltrigger-[T]); Redgate writes them bare (role-App)"

