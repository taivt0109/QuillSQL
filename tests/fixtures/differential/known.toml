finding = "new"
reason = "same as schema-triggers: bracketed trigger header written by Redgate makes quill report the table different"

[[known]]
scenario = "data-views-backup"
oracle = "diffset"
finding = "data H1"
reason = "indexed view is compared when database 1 is a backup; Redgate excludes views from non-live comparisons"

[[known]]
scenario = "data-mot-backup"
oracle = "check"
finding = "data H2"
reason = "Redgate's backup reader crashes on this backup (FormatException in its log reader), so nothing can be compared; quill reads it and leaves the memory-optimized table uncompared"

